<!doctype html>
<html lang="ko">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>던전 서바이버즈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css">
<style>
:root{--bg:#0d0a14;--panel:#1d1628;--panel2:#2a2038;--edge:#5a4880;--gold:#ffd25a;--text:#f1e9ff;--dim:#a99cc2;--red:#e84a5f;--blue:#4ab3e8;--green:#7ce35a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Galmuri11','Galmuri9','DungGeunMo',monospace;color:var(--text);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{image-rendering:pixelated;image-rendering:crisp-edges}
#game{position:absolute;inset:0;width:100%;height:100%}
.hidden{display:none!important}
#hud{position:absolute;inset:0;pointer-events:none;font-size:14px;text-shadow:2px 2px 0 #000}
#xpbar{position:absolute;left:0;right:0;top:0;height:16px;background:#120c1c;border-bottom:2px solid #000}
#xpfill{height:100%;width:0;background:linear-gradient(#7fd4ff,#3a8ae0);transition:width .1s}
#lvl{position:absolute;right:8px;top:0;font-size:12px;line-height:16px}
#tl{position:absolute;left:10px;top:24px;display:flex;flex-direction:column;gap:5px}
.floor{font-size:22px;color:var(--gold)}
.floor small{font-size:13px;color:var(--dim);margin-left:6px}
#hpbar{width:170px;height:14px;background:#2a0c14;border:2px solid #000;position:relative}
#hpfill{height:100%;background:linear-gradient(#ff7a8a,#c8263c);width:100%}
#hptext{position:absolute;inset:0;font-size:10px;line-height:10px;text-align:center}
#stats{font-size:12px;color:var(--dim)}
#tr{position:absolute;right:10px;top:24px;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.icons{display:flex;gap:3px}
.ic{width:30px;height:30px;background:#1d1628cc;border:2px solid #000;position:relative}
.ic canvas{width:100%;height:100%}
.ic b{position:absolute;right:1px;bottom:-1px;font-size:10px;color:var(--gold);font-weight:normal}
#bossbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);width:min(460px,60vw);text-align:center}
#bossname{color:#ff8a8a;font-size:15px;margin-bottom:3px}
#bossbar .bar{height:12px;border:2px solid #000;background:#2a0c14}
#bossfill{height:100%;background:linear-gradient(#ff5a5a,#9a1020);width:100%}
#banner{position:absolute;left:0;right:0;top:34%;text-align:center;pointer-events:none;font-size:42px;color:var(--gold);text-shadow:3px 3px 0 #000,-1px -1px 0 #000;opacity:0;transition:opacity .3s}
#banner.show{opacity:1}
#banner small{display:block;font-size:18px;color:var(--text);margin-top:6px}
#banner.warn{color:#ff4a4a}
#screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#05030acc;overflow:auto;padding:16px}
#screen.clear{background:transparent;pointer-events:none}
.menu{background:var(--panel);border:3px solid #000;box-shadow:0 0 0 3px var(--edge),8px 8px 0 #000;padding:22px 26px;max-width:960px;width:100%;text-align:center}
.menu h1{margin:0 0 6px;font-size:clamp(30px,6vw,54px);color:var(--gold);text-shadow:4px 4px 0 #6a2a10,-2px -2px 0 #000;letter-spacing:2px}
.menu h2{margin:0 0 14px;font-size:24px;color:var(--gold)}
.sub{color:var(--dim);margin:0 0 18px;letter-spacing:3px;font-size:13px}
.hint{color:var(--dim);font-size:12px;margin-top:16px;line-height:1.7}
button{font-family:inherit;font-size:17px;color:var(--text);background:#4a2a7a;border:3px solid #000;box-shadow:inset -3px -3px 0 #2a1450,inset 3px 3px 0 #7a5ab0;padding:10px 26px;margin:6px;cursor:pointer;pointer-events:auto}
button:hover{background:#5e3a96}
button.gold{background:#b07a10;box-shadow:inset -3px -3px 0 #6a4808,inset 3px 3px 0 #ffd25a}
button.gold:hover{background:#c88e1a}
button:disabled{opacity:.4;cursor:default}
#titleHeroes{display:flex;justify-content:center;gap:6px;margin:4px 0 14px;flex-wrap:wrap}
#titleHeroes canvas{width:60px;height:60px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
@media (max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel2);border:3px solid #000;padding:10px 8px;cursor:pointer;text-align:center;position:relative}
.card:hover{background:#3a2c50}
.card.sel{box-shadow:0 0 0 3px var(--gold)}
.card canvas{width:72px;height:72px;display:block;margin:0 auto 4px}
.card .nm{font-size:17px;color:var(--gold)}
.card .tt{font-size:11px;color:var(--dim);margin-bottom:6px}
.card .ds{font-size:11px;line-height:1.5;min-height:34px}
.card .wp{font-size:11px;color:#9fe0ff;margin-top:4px}
#detail{min-height:44px;font-size:13px;color:var(--dim);line-height:1.6;margin-bottom:6px}
.ups{display:flex;flex-direction:column;gap:10px;margin:8px 0}
.up{display:flex;align-items:center;gap:14px;background:var(--panel2);border:3px solid #000;padding:10px 14px;cursor:pointer;text-align:left}
.up:hover{background:#3a2c50;box-shadow:0 0 0 3px var(--gold)}
.up canvas{width:48px;height:48px;flex:none;background:#120c1c;border:2px solid #000}
.up .nm{font-size:16px;color:var(--gold)}
.up .nm em{font-style:normal;font-size:11px;color:#7cf09a;margin-left:6px}
.up .ds{font-size:12px;color:var(--text);margin-top:3px}
.up kbd{margin-left:auto;font-family:inherit;color:var(--dim);font-size:12px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;text-align:left;max-width:360px;margin:10px auto 16px;font-size:14px}
.statgrid span:nth-child(even){text-align:right;color:var(--gold)}
.loot{font-size:14px;line-height:1.9;margin:8px 0 14px}
#joy{position:absolute;width:90px;height:90px;border-radius:50%;border:3px solid #ffffff44;pointer-events:none;display:none}
#joy i{position:absolute;left:30px;top:30px;width:30px;height:30px;border-radius:50%;background:#ffffff66}
</style>

const rand=(a,b)=>a+Math.random()*(b-a), ri=(a,b)=>Math.floor(rand(a,b+1)), pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const $=id=>document.getElementById(id);
const fmtT=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};

const COL={k:'#14101c',W:'#f6f2ea',m:'#c8d0dc',M:'#7a8494',w:'#8a5a32',g:'#ffd040',G:'#c89020',c:'#6ef0ff',r:'#e8344a',R:'#8a1a24',

  n:'#e8dcc8',d:'#7a7a88',D:'#4a4a58',b:'#7a4a2a',B:'#4a2a14'};
function makeSprite(rows,pal={}){
  const h=rows.length,w=Math.max(...rows.map(r=>r.length));
  const c=mk(w,h),x=c.getContext('2d');
  for(let j=0;j<h;j++)for(let i=0;i<rows[j].length;i++){
    const ch=rows[j][i];if(ch==='.'||ch===' ')continue;
    const col=pal[ch]||COL[ch];if(!col)continue;
    x.fillStyle=col;x.fillRect(i,j,1,1);
  }
  return c;
}
function outline(src,col='#0b0810'){
  const c=mk(src.width+2,src.height+2),x=c.getContext('2d');
  const d=src.getContext('2d').getImageData(0,0,src.width,src.height).data;
  x.fillStyle=col;
  for(let j=0;j<src.height;j++)for(let i=0;i<src.width;i++)
    if(d[(j*src.width+i)*4+3]>0){x.fillRect(i,j+1,3,1);x.fillRect(i+1,j,1,3)}
  x.drawImage(src,1,1);return c;
}
function whiten(src){const c=mk(src.width,src.height),x=c.getContext('2d');x.drawImage(src,0,0);x.globalCompositeOperation='source-in';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);return c}
const SPR={};
function regSprite(id,frames,pal,scale=1){
  const f=frames.map(rows=>outline(makeSprite(rows,pal)));
  SPR[id]={f,w:f.map(whiten),scale};
}

function buildHero(h,frame){
  const g=[];for(let y=0;y<20;y++)g.push(Array(20).fill('.'));
  const paste=(rows,ox,oy)=>rows.forEach((r,j)=>{for(let i=0;i<r.length;i++){const c=r[i];if(c==='.')continue;const X=ox+i,Y=oy+j;if(X>=0&&X<20&&Y>=0&&Y<20)g[Y][X]=c}});
  const base=HERO_BASE.slice();if(frame===1){base[14]=LEGS_B[0];base[15]=LEGS_B[1]}
  paste(base,2,4);h.over.forEach(o=>paste(o.r,o.x,o.y));
  return g.map(r=>r.join(''));
}

const DIG=["111101101101111","010110010010111","111001111100111","111001111001111","101101111001001","111100111001111","111100111101111","111001001001001","111101111101111","111101111001111"];
const DIGC={};
function buildDigits(){
  for(const [key,col] of [['n','#ffffff'],['c','#ffd040'],['h','#ff5a6a'],['g','#7cf09a']]){
    DIGC[key]=DIG.map(p=>{const c=mk(3,5),x=c.getContext('2d');x.fillStyle=col;for(let i=0;i<15;i++)if(p[i]==='1')x.fillRect(i%3,Math.floor(i/3),1,1);return outline(c)});
  }
}

let AC=null,muted=false;const sfxLast={};
function tone(f,dur,type='square',vol=.04,slide=0,delay=0){
  const t0=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t0);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+dur);
  g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+dur+.02);
}
function noise(dur,vol=.05,f=800){const n=AC.sampleRate*dur,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f;g.gain.value=vol;s.connect(fl).connect(g).connect(AC.destination);s.start()}
function sfx(k){
  if(muted)return;try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){return}
  const now=performance.now(),gap={hit:45,gem:35,swing:80,throw:70,magic:80,punch:60,bow:80,zap:90,fire:90,frost:200,snipe:120,hurt:150}[k]||0;
  if(gap&&now-(sfxLast[k]||0)<gap)return;sfxLast[k]=now;
  switch(k){
   case'hit':tone(180,.05,'square',.025,-80);break;
   case'gem':tone(900+Math.random()*300,.05,'square',.02,400);break;
   case'swing':noise(.12,.05,1800);break;
   case'throw':tone(1200,.04,'triangle',.03,-600);break;
   case'magic':tone(700,.12,'sine',.04,500);break;
   case'punch':noise(.05,.06,600);break;
   case'bow':tone(500,.06,'triangle',.04,-250);break;
   case'snipe':noise(.18,.09,3000);tone(160,.2,'sawtooth',.04,-100);break;
   case'zap':noise(.15,.07,5000);break;
   case'fire':tone(200,.2,'sawtooth',.03,-120);break;
   case'boom':noise(.25,.08,700);break;
   case'frost':tone(1400,.3,'sine',.03,-900);break;
   case'hurt':tone(220,.15,'sawtooth',.06,-150);break;
   case'level':[523,659,784,1046].forEach((f,i)=>tone(f,.12,'square',.04,0,i*.07));break;
   case'pick':tone(660,.1,'square',.04,300);break;
   case'chest':[392,523,659,784,1046,1318].forEach((f,i)=>tone(f,.16,'square',.04,0,i*.08));break;
   case'warn':[0,.35,.7].forEach(d=>tone(110,.28,'sawtooth',.07,0,d));break;
   case'floor':tone(440,.1,'triangle',.05,0);tone(660,.15,'triangle',.05,0,.1);break;
   case'death':tone(300,.6,'sawtooth',.06,-260);break;
   case'bossdie':noise(.8,.12,500);[262,330,392,523].forEach((f,i)=>tone(f,.3,'square',.04,0,.3+i*.12));break;
  }
}

const CELL=32;
function buildGrid(){grid.clear();for(const e of E){const k=Math.floor(e.x/CELL)*65536+Math.floor(e.y/CELL);let a=grid.get(k);if(!a){a=[];grid.set(k,a)}a.push(e)}}
function forNear(x,y,r,fn){
  const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const a=grid.get(cx*65536+cy);if(a)for(let i=0;i<a.length;i++){const e=a[i];if(!e.dead)fn(e)}}
}
function nearest(x,y,maxR){let best=null,bd=maxR*maxR;for(const e of E){if(e.dead)continue;const d=(e.x-x)**2+(e.y-y)**2;if(d<bd){bd=d;best=e}}return best}
function nearestN(x,y,n,maxR){return E.filter(e=>!e.dead&&(e.x-x)**2+(e.y-y)**2<maxR*maxR).sort((a,b)=>((a.x-x)**2+(a.y-y)**2)-((b.x-x)**2+(b.y-y)**2)).slice(0,n)}
function strongestN(n){return E.filter(e=>!e.dead&&onScreen(e.x,e.y,20)).sort((a,b)=>b.hp-a.hp).slice(0,n)}

  e.maxHp=e.hp;E.push(e);return e;
}
function spawnType(){
  const unlock=Math.min(9,Math.floor(G.floor/2));let tot=0;const ws=[];
  for(let i=0;i<=unlock;i++){const w=Math.max(.35,4-(unlock-i)*.8);ws.push(w);tot+=w}
  let r=Math.random()*tot;for(let i=0;i<=unlock;i++){r-=ws[i];if(r<=0)return i}return unlock;
}
function horde(){

    st:'idle',pt:2,pi:0,pat:null,timer:0,alpha:1,loop};

  $('bossname').textContent=def.name;$('bossbar').classList.remove('hidden');

function bossDefeated(b){

function bossShootRing(b,n,v,spr='p_dark',off=0){for(let i=0;i<n;i++){const a=off+i/n*Math.PI*2;ebullet(b.x,b.y,a,v,b.dmg*.6,spr)}}
function ebullet(x,y,a,v,d,spr='p_dark',r=4,life=5){EB.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,d,spr,r,life})}
function updateBoss(b,dt){
  const dx=P.x-b.x,dy=P.y-b.y,dd=Math.hypot(dx,dy)||1;
  b.timer+=dt;
  if(b.st==='idle'){
    b.x+=dx/dd*b.spd*dt;b.y+=dy/dd*b.spd*dt;b.pt-=dt;
    if(b.pt<=0){b.pat=b.def.pats[b.pi++%b.def.pats.length];b.st=b.pat;b.timer=0;b.phase=0;b.ang=Math.atan2(dy,dx);b.cnt=0;
      if(b.pat==='charge')FX.push({t:'tele',shape:'line',age:0,dur:.7,x:b.x,y:b.y,a:b.ang,len:200,w:b.r*1.6});
      if(b.pat==='slam')FX.push({t:'tele',shape:'circle',age:0,dur:.9,x:b.x,y:b.y,r:70});
      if(b.pat==='meteor'){b.marks=[];for(let i=0;i<8;i++){const m={x:P.x+rand(-90,90),y:P.y+rand(-70,70)};if(i===0){m.x=P.x;m.y=P.y}b.marks.push(m);FX.push({t:'tele',shape:'circle',age:0,dur:1.1,x:m.x,y:m.y,r:24})}}
      if(b.pat==='breath')FX.push({t:'tele',shape:'cone',age:0,dur:.5,x:b.x,y:b.y,a:b.ang,len:150});
    }
    return;
  }
  const done=(rest=1.6)=>{b.st='idle';b.pt=rest/(1+(b.loop-1)*.2)};
  switch(b.st){
   case'charge':
    if(b.timer>.7){if(b.phase===0){b.phase=1;shake(2)}b.x+=Math.cos(b.ang)*290*dt;b.y+=Math.sin(b.ang)*290*dt;if(b.timer%.06<dt)PART.push({x:b.x,y:b.y+b.r,vx:0,vy:0,life:.3,col:'#a89c88'})}
    if(b.timer>1.35)done(1.2);break;
   case'slam':
    if(b.timer>.9&&b.phase===0){b.phase=1;shake(5);sfx('boom');FX.push({t:'ring',age:0,dur:.35,x:b.x,y:b.y,r:70,col:'#ffb040'});
      if(Math.hypot(P.x-b.x,P.y-b.y)<70)hitPlayer(b.dmg*1.3);bossShootRing(b,16,90,'p_efire')}
    if(b.timer>1.4)done();break;
   case'ring':
    if(b.timer>b.cnt*.45&&b.cnt<3){bossShootRing(b,18,85,'p_dark',b.cnt*.17);b.cnt++;sfx('magic')}
    if(b.timer>1.5)done();break;
   case'spiral':
    if(b.timer>b.cnt*.07){const arms=b.def.id==='demon'?4:3;for(let i=0;i<arms;i++)ebullet(b.x,b.y,b.cnt*.23+i*Math.PI*2/arms,80,b.dmg*.55,b.def.id==='vampire'?'p_efire':'p_dark');b.cnt++}
    if(b.timer>2.6)done(1.4);break;
   case'summon':{
    if(b.phase===0){b.phase=1;const ti=b.def.summon;for(let i=0;i<8;i++){const a=i/8*Math.PI*2;const e=spawnEnemy(ti===9?ri(6,9):ti,b.x+Math.cos(a)*30,b.y+Math.sin(a)*30);e.xp=1}burst(b.x,b.y,20,'#a060ff');sfx('magic')}
    if(b.timer>.8)done();break;}
   case'teleport':
    b.alpha=b.timer<.4?1-b.timer/.4:Math.min(1,(b.timer-.4)/.3);
    if(b.timer>.4&&b.phase===0){b.phase=1;const a=rand(0,6.28);b.x=P.x+Math.cos(a)*85;b.y=P.y+Math.sin(a)*85}
    if(b.timer>.7&&b.phase===1){b.phase=2;bossShootRing(b,14,95);sfx('magic')}
    if(b.timer>1.1){b.alpha=1;done(1)}break;
   case'breath':
    if(b.timer>.5&&b.timer<1.8&&b.timer%.04<dt){const a=b.ang+rand(-.35,.35);ebullet(b.x+Math.cos(b.ang)*b.r,b.y+Math.sin(b.ang)*b.r,a,rand(130,170),b.dmg*.5,'p_efire',4,1.4);if(b.timer%.2<dt)sfx('fire')}
    if(b.timer>2)done();break;
   case'fireballs':
    if(b.phase===0){b.phase=1;for(let i=-2;i<=2;i++){const o=ebullet(b.x,b.y,b.ang+i*.25,75,b.dmg*.8,'p_fire',7)}sfx('fire')}
    if(b.timer>1)done();break;
   case'meteor':
    if(b.timer>1.1&&b.phase===0){b.phase=1;shake(4);sfx('boom');b.marks.forEach(m=>{FX.push({t:'ring',age:0,dur:.3,x:m.x,y:m.y,r:24,col:'#ff6a20'});burst(m.x,m.y,10,'#ff8a3a');if(Math.hypot(P.x-m.x,P.y-m.y)<24)hitPlayer(b.dmg*1.1)})}
    if(b.timer>1.5)done();break;
   case'bats':
    if(b.phase===0){b.phase=1;for(let i=0;i<14;i++){const a=i/14*Math.PI*2;spawnEnemy(1,P.x+Math.cos(a)*140,P.y+Math.sin(a)*140).xp=1}sfx('warn')}
    if(b.timer>.8)done();break;
   default:done();
  }
}

function nextFloor(){

  const th=themeOf(G.floor),prev=themeOf(G.floor-1);

}

//  업데이트
// =====================================================================
function update(dt){
  G.time+=dt;
  // 이동
  let mx=0,my=0;
  if(keys.KeyA||keys.ArrowLeft)mx--;if(keys.KeyD||keys.ArrowRight)mx++;if(keys.KeyW||keys.ArrowUp)my--;if(keys.KeyS||keys.ArrowDown)my++;
  if(joy.on){mx=joy.dx;my=joy.dy}
  const ml=Math.hypot(mx,my);P.moving=ml>.15;
  if(P.moving){if(ml>1){mx/=ml;my/=ml}P.x+=mx*P.speed*dt;P.y+=my*P.speed*dt;const l=Math.hypot(mx,my);P.dirx=mx/l;P.diry=my/l;if(Math.abs(mx)>.1)P.face=mx<0?-1:1;P.anim+=dt*8}
  P.inv-=dt;P.hurt-=dt;
  if(P.regen>0&&P.hp<P.maxHp)P.hp=Math.min(P.maxHp,P.hp+P.regen*dt);

  // 층 타이머
  if(!G.boss){G.floorT+=dt;if(G.floorT>=FLOOR_LEN)nextFloor()}
  if(G.victoryPending){G.victoryPending-=dt;if(G.victoryPending<=0){G.victoryPending=0;victory()}}

  // 스폰
  const cap=Math.min(320,40+G.floor*9);
  G.spawnAcc+=dt*(.6+G.floor*.3)*(G.boss?.35:1)*(G.floorT<1.5&&G.floor>1?0:1);
  while(G.spawnAcc>=1){G.spawnAcc--;if(E.length<cap)spawnEnemy(spawnType())}

  buildGrid();
  // 무기
  for(const w of P.weapons){const def=WEAP[w.id],s=def.st(w.lv);
    if(def.update)def.update(w,s,dt);
    else{w.t-=dt;if(w.t<=0){w.t=s.cd*P.cdm;def.fire(w,s)}}}

  // 적
  const farR=Math.hypot(LW,LH)/2+80;
  for(const e of E){
    if(e.dead)continue;
    e.flash-=dt;e.anim+=dt;
    if(e.boss){updateBoss(e,dt);}
    else{
      const dx=P.x-e.x,dy=P.y-e.y,dd=Math.hypot(dx,dy)||1;let sp=e.spd*(e.slow>0?.5:1);e.slow-=dt;
      let vx=dx/dd*sp,vy=dy/dd*sp;const ai=e.def.ai;
      if(ai==='wobble'){const s=Math.sin(G.time*5+e.seed)*sp*.8;vx+=-dy/dd*s;vy+=dx/dd*s}
      else if(ai==='ghost'){const s=Math.sin(G.time*2.5+e.seed)*sp*.6;vx+=-dy/dd*s;vy+=dx/dd*s}
      else if(ai==='dash'){e.timer-=dt;
        if(e.st===0&&e.timer<=0&&dd<140){e.st=1;e.timer=.45;e.da=Math.atan2(dy,dx)}
        else if(e.st===1){vx=vy=0;if(e.timer<=0){e.st=2;e.timer=.45}}
        else if(e.st===2){vx=Math.cos(e.da)*sp*3.2;vy=Math.sin(e.da)*sp*3.2;if(e.timer<=0){e.st=0;e.timer=rand(1.8,3)}}}
      else if(ai==='ranged'){e.timer-=dt;if(dd<90){vx=-vx*.7;vy=-vy*.7}else if(dd<130){vx*=.2;vy*=.2}
        if(e.timer<=0&&dd<200){e.timer=rand(2.2,3);ebullet(e.x,e.y,Math.atan2(dy,dx),75,e.dmg,'p_dark')}}
      e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;e.kx*=Math.pow(.0005,dt);e.ky*=Math.pow(.0005,dt);
      if(vx)e.fx=vx<0?-1:1;
      // 너무 멀어지면 반대편으로 재배치
      if(dd>farR+40){const a=Math.atan2(dy,dx)+rand(-.5,.5);e.x=P.x+Math.cos(a)*farR*.95;e.y=P.y+Math.sin(a)*farR*.95}
    }
    // 접촉
    const cr=e.r+P.r;if((e.x-P.x)**2+(e.y-P.y)**2<cr*cr&&e.alpha!==0)hitPlayer(e.dmg);
  }
  // 겹침 해소
  for(const e of E){if(e.dead||e.def.ai==='ghost')continue;forNear(e.x,e.y,e.r+12,o=>{if(o===e||o.def.ai==='ghost')return;const dx=e.x-o.x,dy=e.y-o.y,d2=dx*dx+dy*dy,rr=(e.r+o.r)*.8;
    if(d2<rr*rr&&d2>0.01){const d=Math.sqrt(d2),push=(rr-d)*.5/d;const we=e.boss?0:o.boss?1:.5;e.x+=dx*push*we*2;e.y+=dy*push*we*2}})}
  E=E.filter(e=>!e.dead);

  // 아군 투사체
  for(const b of B){
    if(b.home&&!b.home.dead){const ta=Math.atan2(b.home.y-b.y,b.home.x-b.x),ca=Math.atan2(b.vy,b.vx);let da=Math.atan2(Math.sin(ta-ca),Math.cos(ta-ca));const na=ca+clamp(da,-6*dt,6*dt);b.vx=Math.cos(na)*b.v;b.vy=Math.sin(na)*b.v}
    else if(b.home&&b.home.dead){b.home=nearest(b.x,b.y,120)}
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.trail&&Math.random()<.6)PART.push({x:b.x,y:b.y,vx:0,vy:0,life:.2,col:b.trail});
    forNear(b.x,b.y,b.r+24,e=>{if(b.life<=0||b.hit.has(e))return;if((e.x-b.x)**2+(e.y-b.y)**2<(b.r+e.r)**2){b.hit.add(e);
      if(b.boom){explode(b);b.life=0;return}
      hurt(e,b.d,b.vx/b.v*80,b.vy/b.v*80,b.crit||0);b.pierce--;if(b.pierce<=0)b.life=0}});
    if(b.life<=0&&b.boom&&!b.exploded)explode(b);
  }
  B=B.filter(b=>b.life>0);
  // 적 투사체
  for(const b of EB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if((b.x-P.x)**2+(b.y-P.y)**2<(b.r+P.r-1)**2){hitPlayer(b.d);b.life=0}}
  EB=EB.filter(b=>b.life>0);

  // 보석 & 아이템
  for(const g of GEMS){const dx=P.x-g.x,dy=P.y-g.y,d=Math.hypot(dx,dy)||1;
    if(d<P.magnet||g.pull){g.pull=true;const s=Math.max(160,g.sp=(g.sp||60)+400*dt);g.x+=dx/d*s*dt;g.y+=dy/d*s*dt}
    if(d<P.r+4){g.got=true;gainXP(g.v);sfx('gem')}}
  GEMS=GEMS.filter(g=>!g.got);
  for(const it of ITEMS){const dx=P.x-it.x,dy=P.y-it.y,d=Math.hypot(dx,dy)||1;
    if(d<P.magnet*.7){it.x+=dx/d*120*dt;it.y+=dy/d*120*dt}
    if(d<P.r+6){it.got=true;pickItem(it)}}
  ITEMS=ITEMS.filter(i=>!i.got);

  // 효과
  for(const f of FX){f.age+=dt;
    if(f.t==='whirl'){const r=f.r;if(f.sp===2&&!f.half&&f.age>f.dur/2){f.half=true;f.hit.clear()}
      forNear(P.x,P.y,r+12,e=>{if(f.hit.has(e))return;const dx=e.x-P.x,dy=e.y-P.y,d=Math.hypot(dx,dy)||1;if(d<r+e.r){f.hit.add(e);hurt(e,f.d,dx/d*160,dy/d*160)}})}
    else if(f.t==='frost'){const r=f.r*Math.min(1,f.age/f.dur);forNear(f.x,f.y,r+12,e=>{if(f.hit.has(e))return;if((e.x-f.x)**2+(e.y-f.y)**2<(r+e.r)**2){f.hit.add(e);e.slow=f.sl;hurt(e,f.d,0,0)}})}
    else if(f.t==='cloud'){f.tick-=dt;if(f.tick<=0){f.tick=.5;if((P.x-f.x)**2+(P.y-f.y)**2<f.r*f.r)hitPlayer(f.d)}}
  }
  FX=FX.filter(f=>f.age<f.dur);
  for(const p of PART){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.9;p.vy*=.9;p.life-=dt}PART=PART.filter(p=>p.life>0);if(PART.length>500)PART.splice(0,PART.length-500);
  for(const n of NUMS)n.age+=dt;NUMS=NUMS.filter(n=>n.age<.7);

  // 카메라
  cam.x=P.x-LW/2;cam.y=P.y-LH/2;shakeAmt=Math.max(0,shakeAmt-dt*12);

  if(G.pendingLv>0&&state==='play')openLevelUp();
}
function explode(b){
  b.exploded=true;const r=b.boom;FX.push({t:'ring',age:0,dur:.3,x:b.x,y:b.y,r,col:'#ff8a3a'});burst(b.x,b.y,10,'#ffb040');sfx('boom');
  forNear(b.x,b.y,r+12,e=>{const dx=e.x-b.x,dy=e.y-b.y,d=Math.hypot(dx,dy)||1;if(d<r+e.r)hurt(e,b.d,dx/d*120,dy/d*120,0,true)});
}
function gainXP(v){P.xp+=v*P.growth;while(P.xp>=P.next){P.xp-=P.next;P.lvl++;P.next=xpNeed(P.lvl);G.pendingLv++}}
function pickItem(it){
  if(it.k==='chicken'){const h=Math.round(P.maxHp*.3);P.hp=Math.min(P.maxHp,P.hp+h);addNum(P.x,P.y-14,h,'g');sfx('pick')}
  else if(it.k==='magnet'){GEMS.forEach(g=>g.pull=true);sfx('pick');banner('','모든 경험치를 끌어당긴다!',900)}
  else if(it.k==='chest')openChest();
}

function drawImg(img,x,y,flip,scale=1,alpha=1){
  const w=img.width*scale,h=img.height*scale,dx=Math.round(x-cam.x-w/2),dy=Math.round(y-cam.y-h/2);
  if(alpha!==1)ctx.globalAlpha=alpha;
  if(flip){ctx.save();ctx.translate(dx+w,dy);ctx.scale(-1,1);ctx.drawImage(img,0,0,w,h);ctx.restore()}
  else ctx.drawImage(img,dx,dy,w,h);
  if(alpha!==1)ctx.globalAlpha=1;
}
function drawRot(img,x,y,a){ctx.save();ctx.translate(Math.round(x-cam.x),Math.round(y-cam.y));ctx.rotate(a);ctx.drawImage(img,-img.width/2,-img.height/2);ctx.restore()}
function shadow(x,y,w){ctx.fillStyle='rgba(0,0,0,.28)';ctx.fillRect(Math.round(x-cam.x-w/2),Math.round(y-cam.y),w,2);ctx.fillRect(Math.round(x-cam.x-w/2+1),Math.round(y-cam.y)-1,w-2,4)}
function drawBG(floor){
  const th=themeOf(floor),t=tileFor(th);
  const x0=Math.floor(cam.x/32),y0=Math.floor(cam.y/32);
  for(let i=x0;i<=x0+Math.ceil(LW/32)+1;i++)for(let j=y0;j<=y0+Math.ceil(LH/32)+1;j++){
    const px=Math.round(i*32-cam.x),py=Math.round(j*32-cam.y);ctx.drawImage(t,px,py);
    const h=hash(i,j);if(h<.22){const d=decoSpr(th,Math.floor(hash(j,i)*DECO[th.deco].length));ctx.drawImage(d,px+Math.floor(h*90)%24,py+Math.floor(h*300)%24)}
  }
}
function drawNum(n){
  const s=String(n.v),dig=DIGC[n.col],w=s.length*4,x=Math.round(n.x-cam.x-w/2),y=Math.round(n.y-cam.y-n.age*18);
  ctx.globalAlpha=n.age>.5?1-(n.age-.5)/.2:1;for(let i=0;i<s.length;i++)ctx.drawImage(dig[+s[i]],x+i*4,y);ctx.globalAlpha=1;
}
function render(){
  const sx=shakeAmt?rand(-shakeAmt,shakeAmt):0,sy=shakeAmt?rand(-shakeAmt,shakeAmt):0;
  cam.x+=sx;cam.y+=sy;
  drawBG(G.floor);
  // 바닥 효과
  for(const f of FX){
    if(f.t==='cloud'){ctx.globalAlpha=.35*(1-f.age/f.dur);ctx.fillStyle='#8adf4a';circ(f.x,f.y,f.r);ctx.globalAlpha=1}
    if(f.t==='tele'){const k=f.age/f.dur;ctx.globalAlpha=.18+.25*k;ctx.fillStyle='#ff2a2a';
      if(f.shape==='circle')circ(f.x,f.y,f.r);
      else if(f.shape==='line'){ctx.save();ctx.translate(f.x-cam.x,f.y-cam.y);ctx.rotate(f.a);ctx.fillRect(0,-f.w/2,f.len,f.w);ctx.restore()}
      else if(f.shape==='cone'){ctx.beginPath();ctx.moveTo(f.x-cam.x,f.y-cam.y);ctx.arc(f.x-cam.x,f.y-cam.y,f.len,f.a-.4,f.a+.4);ctx.fill()}
      ctx.globalAlpha=1}
  }
  const aura=P.weapons.find(w=>w.id==='aura');
  if(aura&&aura.r){ctx.globalAlpha=.16+.05*Math.sin(G.time*6);ctx.fillStyle='#ffe070';circ(P.x,P.y,aura.r);ctx.globalAlpha=.5;ctx.strokeStyle='#fff0a0';ctx.lineWidth=1;ctx.beginPath();ctx.arc(Math.round(P.x-cam.x),Math.round(P.y-cam.y),aura.r,0,7);ctx.stroke();ctx.globalAlpha=1}
  // 보석 / 아이템
  for(const g of GEMS){if(!onScreen(g.x,g.y,8))continue;const s=SPR[g.v>=10?'p_gem3':g.v>=3?'p_gem2':'p_gem1'];drawImg(s.f[0],g.x,g.y+Math.sin(G.time*4+g.x)*1)}
  for(const it of ITEMS){const s=SPR['p_'+it.k];shadow(it.x,it.y+5,8);drawImg(s.f[0],it.x,it.y+Math.sin(G.time*3)*1.5,false,1);
    if(it.k==='chest'){ctx.globalAlpha=.4+.3*Math.sin(G.time*6);ctx.fillStyle='#ffd040';circ(it.x,it.y,12);ctx.globalAlpha=1}}
  // 개체 (y 정렬)
  const ents=E.filter(e=>onScreen(e.x,e.y,60));ents.push(P);ents.sort((a,b)=>a.y-b.y);
  for(const e of ents){
    if(e===P){drawPlayer();continue}
    const s=SPR[e.def.id],sc=(s.scale||1)*(e.small?.65:1),fr=Math.floor(e.anim*(e.boss?3:5))%s.f.length;
    const img=e.flash>0?s.w[fr]:s.f[fr];
    shadow(e.x,e.y+img.height*sc/2-2,Math.max(6,img.width*sc*.6));
    let alpha=(e.def.alpha||1)*(e.alpha??1);
    if(e.def.ai==='dash'&&e.st===1&&Math.floor(G.time*20)%2)ctx.filter='brightness(2)';
    const flip=e.boss?(P.x<e.x):((e.fx||(P.x<e.x?-1:1))<0);
    drawImg(img,e.x,e.y,flip,sc,alpha);
    ctx.filter='none';
    if(e.slow>0){ctx.globalAlpha=.35;ctx.fillStyle='#7ad0ff';ctx.fillRect(Math.round(e.x-cam.x-img.width*sc/2),Math.round(e.y-cam.y-img.height*sc/2),img.width*sc,img.height*sc);ctx.globalAlpha=1}
    if(!e.boss&&e.hp<e.maxHp&&e.maxHp>60){const w=14,x=Math.round(e.x-cam.x-w/2),y=Math.round(e.y-cam.y-img.height*sc/2-4);ctx.fillStyle='#000';ctx.fillRect(x-1,y-1,w+2,3);ctx.fillStyle='#e84a5f';ctx.fillRect(x,y,Math.max(0,w*e.hp/e.maxHp),1)}
  }
  // 오브
  const orb=P.weapons.find(w=>w.id==='orb');if(orb&&orb.pos)for(const [x,y] of orb.pos){ctx.globalAlpha=.3;ctx.fillStyle='#fff8a0';circ(x,y,6);ctx.globalAlpha=1;drawImg(SPR.p_orb.f[0],x,y)}
  // 투사체
  for(const b of B){const s=SPR[b.spr];if(b.spr==='p_missile'||b.spr==='p_fire')drawImg(s.f[0],b.x,b.y);else drawRot(s.f[0],b.x,b.y,Math.atan2(b.vy,b.vx))}
  for(const b of EB){const s=SPR[b.spr];drawImg(s.f[0],b.x,b.y,false,b.r>5?2:1)}
  // 공격 효과
  for(const f of FX){const k=f.age/f.dur;
    if(f.t==='whirl'){const turns=f.sp,a0=k*Math.PI*2*turns;ctx.globalAlpha=.35*(1-k*.5);ctx.strokeStyle='#ffe0c0';ctx.lineWidth=3;ctx.beginPath();ctx.arc(Math.round(P.x-cam.x),Math.round(P.y-cam.y),f.r*.85,a0-1.6,a0);ctx.stroke();ctx.globalAlpha=1;
      for(let i=0;i<2;i++){const a=a0+i*Math.PI;drawRot(SPR.p_axe.f[0],P.x+Math.cos(a)*f.r*.8,P.y+Math.sin(a)*f.r*.8,a+Math.PI/2)}}
    else if(f.t==='slash'){ctx.globalAlpha=1-k;ctx.strokeStyle='#ffffff';ctx.lineWidth=4;ctx.beginPath();const cx=Math.round(P.x-cam.x),cy=Math.round(P.y-cam.y);ctx.arc(cx,cy,f.r*(.6+.3*k),f.a-1,f.a+1);ctx.stroke();ctx.strokeStyle='#8ac8ff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,f.r*(.85+.15*k),f.a-.9,f.a+.9);ctx.stroke();ctx.globalAlpha=1}
    else if(f.t==='punch'){ctx.fillStyle=k<.5?'#ffffff':'#ffd040';const r=3+k*6;ctx.globalAlpha=1-k;circ(f.x,f.y,r);ctx.globalAlpha=1}
    else if(f.t==='ring'){ctx.globalAlpha=1-k;ctx.strokeStyle=f.col;ctx.lineWidth=2;ctx.beginPath();ctx.arc(Math.round(f.x-cam.x),Math.round(f.y-cam.y),f.r*(.4+.6*k),0,7);ctx.stroke();ctx.globalAlpha=1}
    else if(f.t==='frost'){const r=f.r*Math.min(1,k);ctx.globalAlpha=.7*(1-k);ctx.strokeStyle='#bff0ff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(Math.round(f.x-cam.x),Math.round(f.y-cam.y),r,0,7);ctx.stroke();ctx.fillStyle='#6ad0ff';ctx.globalAlpha=.12*(1-k);circ(f.x,f.y,r);ctx.globalAlpha=1}
    else if(f.t==='bolt'){ctx.globalAlpha=1-k;ctx.fillStyle='#fff8a0';let x=f.x-cam.x,y=f.y-cam.y-LH;let s=f.seed*1000;while(y<f.y-cam.y){const nx=x+((s=(s*9301+49297)%233280)/233280-.5)*10;ctx.fillRect(Math.round(Math.min(x,nx)),Math.round(y),Math.max(2,Math.abs(nx-x)),9);x=nx;y+=8}ctx.fillStyle='#ffffff';circ(f.x,f.y,5*(1-k));ctx.globalAlpha=1}
    else if(f.t==='laser'){ctx.globalAlpha=1-k;ctx.strokeStyle='#ff4a4a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(f.x-cam.x,f.y-cam.y);ctx.lineTo(f.x-cam.x+Math.cos(f.a)*400,f.y-cam.y+Math.sin(f.a)*400);ctx.stroke();ctx.globalAlpha=1}
  }
  for(const p of PART){ctx.fillStyle=p.col;ctx.fillRect(Math.round(p.x-cam.x),Math.round(p.y-cam.y),1,1)}
  for(const n of NUMS)drawNum(n);
  // 화면 밖 상자 표시
  for(const it of ITEMS)if(it.k==='chest'&&!onScreen(it.x,it.y,0)){const a=Math.atan2(it.y-P.y,it.x-P.x),x=clamp(LW/2+Math.cos(a)*LW,8,LW-8),y=clamp(LH/2+Math.sin(a)*LH,24,LH-8);ctx.fillStyle='#ffd040';ctx.fillRect(Math.round(x)-2,Math.round(y)-2,4,4)}
  // 비네트 / 피격
  const vg=ctx.createRadialGradient(LW/2,LH/2,LH*.35,LW/2,LH/2,LW*.7);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,P.hurt>0?'rgba(140,0,20,.5)':'rgba(0,0,0,.45)');ctx.fillStyle=vg;ctx.fillRect(0,0,LW,LH);
  cam.x-=sx;cam.y-=sy;
}
function circ(x,y,r){ctx.beginPath();ctx.arc(Math.round(x-cam.x),Math.round(y-cam.y),Math.max(0,r),0,7);ctx.fill()}
function drawPlayer(){
  const h=P.hero,fr=P.moving?Math.floor(P.anim)%2:0,img=(P.hurt>0&&Math.floor(G.time*20)%2)?h.sprW[fr]:h.spr[fr];
  shadow(P.x,P.y+9,10);
  const bob=P.moving&&fr?-1:0;
  drawImg(img,P.x,P.y+bob,P.face<0,1,P.inv>0&&!(P.hurt>0)?(Math.floor(G.time*16)%2?.6:1):1);
}

// =====================================================================
//  HUD
// =====================================================================
const iconURL={};
function iconCanvas(id,size){const c=mk(size,size),x=c.getContext('2d');x.imageSmoothingEnabled=false;const src=ICO[id];const s=Math.floor(size/src.width);x.drawImage(src,Math.floor((size-src.width*s)/2),Math.floor((size-src.height*s)/2),src.width*s,src.height*s);return c}
function buildHUDIcons(){
  const wi=$('wicons'),pi=$('picons');wi.innerHTML='';pi.innerHTML='';
  P.weapons.forEach(w=>{const d=document.createElement('div');d.className='ic';d.appendChild(iconCanvas(w.id,30));d.insertAdjacentHTML('beforeend',`<b>${w.lv>=8?'MAX':w.lv}</b>`);wi.appendChild(d)});
  for(const k in P.passives){const d=document.createElement('div');d.className='ic';d.appendChild(iconCanvas(k,30));d.insertAdjacentHTML('beforeend',`<b>${P.passives[k]>=PASS[k].max?'M':P.passives[k]}</b>`);pi.appendChild(d)}
}
let hudCache={};
function setText(id,v){if(hudCache[id]!==v){hudCache[id]=v;$(id).textContent=v}}
function setW(id,v){v=Math.round(v*1000)/10+'%';if(hudCache[id+'w']!==v){hudCache[id+'w']=v;$(id).style.width=v}}
function updateHUD(){
  setW('xpfill',P.xp/P.next);setText('lvl','LV '+P.lvl);
  setText('floor',G.floor+'층');setText('ftime',G.boss?'보스전':'다음 층까지 '+Math.ceil(FLOOR_LEN-G.floorT)+'초');
  setW('hpfill',P.hp/P.maxHp);setText('hptext',Math.ceil(P.hp)+' / '+P.maxHp);
  setText('stats',`${fmtT(G.time)}  ·  처치 ${G.kills}`);
  if(G.boss)setW('bossfill',G.boss.hp/G.boss.maxHp);
}
let bannerT=null;
function banner(t,sub='',ms=1600,warn=false){const b=$('banner');b.innerHTML=t+(sub?`<small>${sub}</small>`:'');b.classList.toggle('warn',warn);b.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('show'),ms)}

// =====================================================================
//  화면 (메뉴)
// =====================================================================
const scr=$('screen');
function showScreen(html,clear=false){if(html==null){scr.classList.add('hidden');scr.innerHTML='';return}scr.classList.remove('hidden');scr.classList.toggle('clear',clear);scr.innerHTML=html}
function heroCanvas(h,size){const c=mk(h.spr[0].width,h.spr[0].height);c.getContext('2d').drawImage(h.spr[0],0,0);c.style.width=size+'px';c.style.height=size+'px';return c}
function titleScreen(){
  state='title';$('hud').classList.add('hidden');
  showScreen(`<div class="menu"><h1>던전 서바이버즈</h1><p class="sub">PIXEL FANTASY SURVIVORS</p><div id="titleHeroes"></div>
   <p style="font-size:14px;line-height:1.8;margin:0 0 10px">끝없이 몰려오는 마물의 탑을 50층까지 돌파하라!<br><span style="color:var(--dim)">10층마다 강력한 보스가 기다린다.</span></p>
   <button class="gold" data-act="select">모험 시작</button>
   <p class="hint">이동: WASD / 방향키 (모바일: 화면 드래그) · 공격은 자동<br>ESC/P 일시정지 · M 음소거</p></div>`);
  const th=$('titleHeroes');HEROES.forEach(h=>th.appendChild(heroCanvas(h,60)));
}
function selectScreen(){
  state='select';
  showScreen(`<div class="menu"><h2>영웅 선택</h2><div class="grid" id="heroGrid"></div><div id="detail"></div>
   <button data-act="title">뒤로</button><button class="gold" data-act="start">출발!</button></div>`);
  const g=$('heroGrid');
  HEROES.forEach((h,i)=>{const c=document.createElement('div');c.className='card'+(i===selHero?' sel':'');c.dataset.hero=i;
    c.appendChild(heroCanvas(h,72));c.insertAdjacentHTML('beforeend',`<div class="nm">${h.name}</div><div class="tt">${h.title}</div><div class="ds">${h.bonus}</div><div class="wp">▶ ${WEAP[h.weapon].name}</div>`);g.appendChild(c)});
  showDetail();
}
function showDetail(){const h=HEROES[selHero];$('detail').innerHTML=`<span style="color:var(--gold)">${h.name}</span> — ${h.desc}`}
scr.addEventListener('click',e=>{
  const card=e.target.closest('.card');if(card&&card.dataset.hero!==undefined){selHero=+card.dataset.hero;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('sel',c===card));showDetail();sfx('pick');return}
  const up=e.target.closest('.up');if(up){chooseUp(+up.dataset.i);return}
  const b=e.target.closest('[data-act]');if(!b)return;sfx('pick');
  ({select:selectScreen,title:titleScreen,start:()=>newGame(selHero),resume,retry:()=>newGame(selHero),endless:()=>{G.endless=true;state='play';showScreen(null);banner('무한 모드','끝없는 탑을 오르자!')},closeChest:()=>{state='play';showScreen(null)}})[b.dataset.act]?.();
});
scr.addEventListener('dblclick',e=>{const card=e.target.closest('.card');if(card)newGame(+card.dataset.hero)});

function pause(){state='pause';showScreen(`<div class="menu" style="max-width:420px"><h2>일시정지</h2>
  <div class="statgrid"><span>영웅</span><span>${P.hero.name}</span><span>층</span><span>${G.floor}층</span><span>레벨</span><span>${P.lvl}</span><span>처치</span><span>${G.kills}</span>
  <span>피해량</span><span>${Math.round(P.might*100)}%</span><span>방어</span><span>${P.armor}</span><span>치명타</span><span>${Math.round(P.crit*100)}%</span><span>재생</span><span>${P.regen.toFixed(1)}/s</span></div>
  <button class="gold" data-act="resume">계속하기</button><button data-act="title">타이틀로</button></div>`)}
function resume(){state='play';showScreen(null)}

let curChoices=[];
function getChoices(n){
  const opts=[];
  P.weapons.forEach(w=>{if(w.lv<8)opts.push({type:'w',id:w.id,wt:1.4})});
  if(P.weapons.length<6)for(const id in WEAP)if(!P.weapons.find(w=>w.id===id))opts.push({type:'w',id,isNew:true,wt:1});
  const pc=Object.keys(P.passives).length;
  for(const id in PASS){const lv=P.passives[id]||0;if(lv>0&&lv<PASS[id].max)opts.push({type:'p',id,wt:1.1});else if(lv===0&&pc<6)opts.push({type:'p',id,isNew:true,wt:.8})}
  const out=[];
  while(out.length<n&&opts.length){let tot=opts.reduce((s,o)=>s+o.wt,0),r=Math.random()*tot,i=0;for(;i<opts.length;i++){r-=opts[i].wt;if(r<=0)break}out.push(opts.splice(Math.min(i,opts.length-1),1)[0])}
  if(!out.length)out.push({type:'heal'},{type:'gold'});
  return out;
}
function upInfo(c){
  if(c.type==='w'){const d=WEAP[c.id],w=P.weapons.find(x=>x.id===c.id),lv=w?w.lv:0;return{icon:c.id,name:d.name,tag:c.isNew?'NEW':'Lv '+(lv+1),desc:c.isNew?d.desc:d.ups[lv-1]}}
  if(c.type==='p'){const d=PASS[c.id],lv=P.passives[c.id]||0;return{icon:c.id,name:d.name,tag:c.isNew?'NEW':'Lv '+(lv+1),desc:d.desc}}
  if(c.type==='heal')return{icon:'heal',name:'회복 물약',tag:'',desc:'HP 50% 회복'};
  return{icon:'gold',name:'금화 주머니',tag:'',desc:'금화 +50 (점수)'};
}
function applyUp(c){
  if(c.type==='w'){const w=P.weapons.find(x=>x.id===c.id);if(w)w.lv++;else addWeapon(c.id)}
  else if(c.type==='p'){P.passives[c.id]=(P.passives[c.id]||0)+1;recalc()}
  else if(c.type==='heal')P.hp=Math.min(P.maxHp,P.hp+P.maxHp*.5);
  else G.gold+=50;
  buildHUDIcons();
}
function openLevelUp(){
  state='levelup';G.pendingLv--;sfx('level');
  curChoices=getChoices(Math.random()<P.crit*.6?4:3);
  showScreen(`<div class="menu" style="max-width:520px"><h2>레벨 업! <span style="font-size:15px;color:var(--text)">LV ${P.lvl-G.pendingLv}</span></h2><div class="ups">${curChoices.map((c,i)=>{const u=upInfo(c);
    return`<div class="up" data-i="${i}"><canvas data-icon="${u.icon}"></canvas><div><div class="nm">${u.name}<em>${u.tag}</em></div><div class="ds">${u.desc}</div></div><kbd>${i+1}</kbd></div>`}).join('')}</div></div>`);
  document.querySelectorAll('canvas[data-icon]').forEach(c=>{const ic=iconCanvas(c.dataset.icon,48);c.width=48;c.height=48;c.getContext('2d').drawImage(ic,0,0)});
}
function chooseUp(i){const c=curChoices[i];if(!c)return;applyUp(c);sfx('pick');if(G.pendingLv>0)openLevelUp();else{state='play';showScreen(null)}}
function openChest(){
  state='chest';sfx('chest');
  const got=[];for(let i=0;i<3;i++){const c=getChoices(1)[0];applyUp(c);got.push(upInfo(c))}
  showScreen(`<div class="menu" style="max-width:460px"><h2>✦ 보물 상자 ✦</h2><div class="ups">${got.map(u=>`<div class="up" style="cursor:default"><canvas data-icon="${u.icon}"></canvas><div><div class="nm">${u.name}<em>${u.tag}</em></div><div class="ds">${u.desc}</div></div></div>`).join('')}</div>
   <button class="gold" data-act="closeChest">계속</button></div>`);
  document.querySelectorAll('canvas[data-icon]').forEach(c=>{const ic=iconCanvas(c.dataset.icon,48);c.width=48;c.height=48;c.getContext('2d').drawImage(ic,0,0)});
}
function resultStats(){return`<div class="statgrid"><span>영웅</span><span>${P.hero.name}</span><span>도달 층</span><span>${G.floor}층</span><span>생존 시간</span><span>${fmtT(G.time)}</span>
  <span>레벨</span><span>${P.lvl}</span><span>처치 수</span><span>${G.kills}</span><span>보스 격파</span><span>${G.bossCount}</span><span>총 피해량</span><span>${G.dmgDealt.toLocaleString()}</span></div>`}
function gameOver(){
  state='over';sfx('death');burst(P.x,P.y,30,P.hero.pal.h);
  setTimeout(()=>showScreen(`<div class="menu" style="max-width:460px"><h2 style="color:var(--red)">쓰러졌다…</h2>${resultStats()}
   <button class="gold" data-act="retry">다시 도전</button><button data-act="select">영웅 선택</button></div>`),900);
}
function victory(){
  state='victory';
  showScreen(`<div class="menu" style="max-width:480px"><h2>🏆 탑 정복! 🏆</h2><p style="line-height:1.7">${P.hero.name}이(가) 마왕 아자젤을 쓰러뜨리고<br>50층의 탑을 정복했다!</p>${resultStats()}
   <button class="gold" data-act="endless">무한 모드 계속</button><button data-act="select">영웅 선택</button></div>`);
}

// =====================================================================
//  메인 루프
// =====================================================================
let last=performance.now(),titleCam=0;
function loop(now){
  const dt=Math.min(1/30,(now-last)/1000);last=now;
  if(state==='play')update(dt);
  else if(state==='over'){for(const p of PART){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}PART=PART.filter(p=>p.life>0)}
  if(G&&state!=='title'&&state!=='select'){render();updateHUD()}
  else{titleCam+=dt*20;cam.x=titleCam;cam.y=titleCam*.4;drawBG(1+Math.floor(titleCam/400)%5*10);ctx.fillStyle='rgba(0,0,0,.35)';ctx.fillRect(0,0,LW,LH)}
  requestAnimationFrame(loop);
}
resize();buildAll();buildDigits();titleScreen();requestAnimationFrame(loop);
</script>
